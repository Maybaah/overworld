name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - run: npm ci
      - run: npm ci --prefix web

      - name: Typecheck pipeline
        run: npx tsc --noEmit

      - name: Pipeline tests
        run: npm test

      - name: Sample data
        run: npm run fixture

      - name: App tests
        run: npm test --prefix web

      - name: Build app
        run: npm run build --prefix web
