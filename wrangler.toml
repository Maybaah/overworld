name = "overworld"
main = "web/server/worker.ts"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "overworld.maybaah.com", custom_domain = true }]

[assets]
directory = "web/dist"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[ratelimits]]
name = "STEAM_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "EVENTS_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
